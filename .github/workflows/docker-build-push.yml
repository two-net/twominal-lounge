name: Build and Push Embedded Container Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build in Runner & Push Runtime Image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twominal_lounge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Build Angular Frontend in GitHub Actions Runner
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Frontend Dependencies
        working-directory: src/TwominalLounge.Angular
        run: pnpm install --frozen-lockfile

      - name: Run Angular Frontend Unit Tests
        working-directory: src/TwominalLounge.Angular
        run: pnpm run test --watch=false

      - name: Build Angular Frontend SPA
        working-directory: src/TwominalLounge.Angular
        run: pnpm run build --configuration production

      # -----------------------------------------------------------------------
      # 2. Build Rust Backend in GitHub Actions Runner (Embedding Frontend)
      # -----------------------------------------------------------------------
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust Backend Unit Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/twominal_lounge
        run: cargo test

      - name: Build Rust Release Binary with Embedded Frontend
        run: cargo build --release --locked --bin twominal_lounge

      # -----------------------------------------------------------------------
      # 3. Package Pre-Built Binary into Runtime Docker Image & Push to GHCR
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Package and Push Docker Runtime Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          load: ${{ github.event_name == 'pull_request' || (github.event.inputs.push_image == 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Runtime Container (Zero Source Code Assertion)
        if: github.event_name == 'pull_request' || (github.event.inputs.push_image == 'false')
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Verifying image filesystem: $FIRST_TAG"
          docker run --rm "$FIRST_TAG" sh -c '
            echo "Checking for .rs files:"
            find /app /usr/local/bin -name "*.rs" | grep . && exit 1 || echo "✓ No .rs files found"
            echo "Checking for .ts files:"
            find /app /usr/local/bin -name "*.ts" | grep . && exit 1 || echo "✓ No .ts files found"
            echo "Checking for node_modules:"
            find /app -name "node_modules" | grep . && exit 1 || echo "✓ No node_modules found"
            echo "Checking runtime executable:"
            test -x /usr/local/bin/twominal_lounge && echo "✓ Runtime binary present and executable"
          '
